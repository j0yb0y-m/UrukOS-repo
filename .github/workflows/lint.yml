name: lint
on: [push, pull_request]
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm rpmlint shellcheck python3-ruff
      - name: rpmlint
        run: ./scripts/lint-specs.sh
      - name: shellcheck
        run: shellcheck scripts/*.sh
      - name: ruff
        run: ruff check packages/anu/files/anu
